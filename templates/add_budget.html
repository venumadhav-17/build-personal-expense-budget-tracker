{% extends "base.html" %}
{% block title %}Set Budget · SunsetWallet{% endblock %}
{% block content %}

<section class="form-page reveal">
  <div class="panel glass form-panel">
    <div class="panel-header">
      <h2><i class="fa-solid fa-plus"></i> Set Budget</h2>
    </div>
    <form method="post" class="stacked-form">
      <div class="input-group">
        <label>Month</label>
        <input type="month" name="month" value="{{ form.get('month','') }}" required>
      </div>
      <div class="input-group">
        <label>Category</label>
        <select name="category" required>
          <option value="">Select category</option>
          {% for c in categories %}
            <option value="{{ c }}" {{ 'selected' if c == form.get('category') else '' }}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="input-group span-2">
        <label>Limit Amount (₹)</label>
        <input type="number" step="0.01" min="0.01" name="limit_amount" value="{{ form.get('limit_amount','') }}" required>
      </div>
      <div class="form-actions span-2">
        <a href="{{ url_for('list_budgets') }}" class="btn-ghost">Cancel</a>
        <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Budget</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
